name: Assets build
on:
  workflow_dispatch:
  # The `release: create` event (nor-any other release type events) are not triggered for release draft creation
  # which is needed to have all the assets build when the release goes out.
  # We hence uses `repository_dispatch` from the `release.yaml` workflow when release is created by the release-please mechanism.
  repository_dispatch:
    types: [assets-build]

jobs:
  # Runs before any job that waits on the release approval or holds signing secrets,
  # so a commit that is not on a protected branch is rejected up front.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release commit is on a protected branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCHES: "master"
        run: |
          set -euo pipefail
          for b in $BRANCHES; do
            st=$(gh api "repos/$REPO/compare/$b...$SHA" --jq .status 2>/dev/null || echo error)
            if [ "$st" = identical ] || [ "$st" = behind ]; then echo "OK: $SHA is on $b"; exit 0; fi
          done
          echo "::error::$SHA is not on any of: $BRANCHES. Refusing to publish."; exit 1

  publish-macos-m1:
    runs-on: macos-15
    needs: verify
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: 24.15.0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install setuptools
        run: python3 -m pip install setuptools

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile && cd ./ui && pnpm install --frozen-lockfile

      - name: Set MacOS signing certs
        run: .github/tools/add-macos-cert.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build
        run: pnpm run build
        env:
          VITE_FORMBRICKS_ENV_ID: ${{ secrets.VITE_FORMBRICKS_ENV_ID }}
          VITE_FORMBRICKS_APP_URL: ${{ secrets.VITE_FORMBRICKS_APP_URL }}

      - name: Copy dashboard lib
        run: cp ./ui/node_modules/@ethersphere/bee-dashboard/lib/* ./dist/ui/static/js
        continue-on-error: true

      - name: Purge ui src
        run: npx rimraf ./ui

      - name: Publish MacOS arm64
        run: pnpm run publish:mac:arm64
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos-x64:
    runs-on: macos-15
    needs: verify
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: 24.15.0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install setuptools
        run: python3 -m pip install setuptools

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile && cd ./ui && pnpm install --frozen-lockfile

      - name: Set MacOS signing certs
        run: .github/tools/add-macos-cert.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build
        run: pnpm run build
        env:
          VITE_FORMBRICKS_ENV_ID: ${{ secrets.VITE_FORMBRICKS_ENV_ID }}
          VITE_FORMBRICKS_APP_URL: ${{ secrets.VITE_FORMBRICKS_APP_URL }}

      - name: Copy dashboard lib
        run: cp ./ui/node_modules/@ethersphere/bee-dashboard/lib/* ./dist/ui/static/js
        continue-on-error: true

      - name: Purge ui src
        run: npx rimraf ./ui

      - name: Publish MacOS x64
        run: pnpm run publish:mac:x64
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    needs: verify
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: 24.15.0

      - uses: actions/setup-python@v4
        if: matrix.os == 'macos-latest'
        with:
          python-version: '3.12'

      - name: Install setuptools
        if: matrix.os == 'macos-latest'
        run: python3 -m pip install setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && cd ./ui && pnpm install --frozen-lockfile

      - name: Set MacOS signing certs
        if: matrix.os == 'macos-latest'
        run: .github/tools/add-macos-cert.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Set Windows signing certificate
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        id: write_file
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'win-certificate.pfx'
          encodedString: ${{ secrets.WINDOWS_CODESIGN_P12 }}

      - name: Build
        run: pnpm run build
        env:
          VITE_FORMBRICKS_ENV_ID: ${{ secrets.VITE_FORMBRICKS_ENV_ID }}
          VITE_FORMBRICKS_APP_URL: ${{ secrets.VITE_FORMBRICKS_APP_URL }}

      - name: Copy dashboard lib
        run: cp ./ui/node_modules/@ethersphere/bee-dashboard/lib/* ./dist/ui/static/js
        continue-on-error: true

      - name: Purge ui src
        run: npx rimraf ./ui

      - name: Publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CODESIGN_FILE: ${{ steps.write_file.outputs.filePath }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: pnpm run publish

      - name: Publish Linux arm64
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run publish:linux:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
