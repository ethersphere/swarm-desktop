# On each new commit to master, create/update a PR with release
# automatically bumps version and creates changelog as per conventional commits
name: Release
on:
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BEE_RUNNER_APP_ID }}
          private-key: ${{ secrets.BEE_RUNNER_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: ${{ contains(github.event.head_commit.message, 'release-please--branches--master') }}
      - name: Trigger assets builds on release
        if: ${{ steps.release.outputs.release_created }}
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          event-type: assets-build
          client-payload: '{"version": "${{ steps.release.outputs.tag_name }}"}'