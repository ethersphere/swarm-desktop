# On each new commit to master, create/update a PR with release
# automatically bumps version and creates changelog as per conventional commits
name: Release
on:
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only this environment (default branch only) holds RELEASE_APP_KEY.
    environment: release-ci
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          # Least privilege: release-please updates the release PR (and its labels) and creates the release + tag; contents:write also covers the repository dispatch.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: ${{ contains(github.event.head_commit.message, 'release-please--branches--master') }}
      - name: Trigger assets builds on release
        if: ${{ steps.release.outputs.release_created }}
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          event-type: assets-build
          client-payload: '{"version": "${{ steps.release.outputs.tag_name }}"}'